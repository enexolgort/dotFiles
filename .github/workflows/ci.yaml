name: CI

on:
  push:
  pull_request:

jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # NOTE: we deliberately do NOT run a blanket `nix flake check
      # --all-systems` here. That tries to fully build BOTH
      # nixosConfigurations, and the real-machine target depends on
      # hardware-configuration.nix — which is a placeholder in this repo
      # on purpose (it's generated from real hardware, and a generic CI
      # runner has no way to genuinely satisfy that). That target can
      # only be validated on the real machine itself.
      #
      # The WSL target, on the other hand, doesn't depend on
      # hardware-configuration.nix at all (WSL2 owns that layer) — so
      # it's the one target CI actually *can* meaningfully build in
      # full, and it covers the vast majority of the actual config
      # (everything in common/, home.nix, flake.nix itself).
      #
      # The WSL target's name is derived from vars.hostname (e.g.
      # "scrapy" -> "scrapy-wsl", "dusty" -> "dusty-wsl") — found
      # dynamically here rather than hardcoded, so this doesn't silently
      # break every time the hostname changes.
      - name: Check formatting
        run: |
          cd nixOS
          nix build .#checks.x86_64-linux.formatting --no-link

      - name: Build the WSL target (the one CI can fully validate)
        run: |
          cd nixOS
          WSL_TARGET=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[] | select(endswith("-wsl"))')
          if [ -z "$WSL_TARGET" ]; then
            echo "No nixosConfigurations entry ending in -wsl found — check vars.nix/flake.nix"
            exit 1
          fi
          echo "Building nixosConfigurations.$WSL_TARGET"
          nix build ".#nixosConfigurations.$WSL_TARGET.config.system.build.toplevel" --no-link

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck everything in scripts/
        run: shellcheck scripts/*.sh
